<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Вхід</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="example@mail.com">
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <mat-error>Введіть коректний email</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Пароль</mat-label>
          <input matInput formControlName="password" type="password">
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <mat-error>Пароль має містити мінімум 6 символів</mat-error>
          }
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
          Увійти
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
