<h2 mat-dialog-title>Додати річ до категорії: {{ data.categoryName }}</h2>

<mat-dialog-content>
  <form [formGroup]="gearForm" class="gear-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Назва речі</mat-label>
      <input matInput formControlName="name" placeholder="Наприклад: Намет" />
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Вага в грамах</mat-label>
        <input matInput type="number" formControlName="weightInGrams" min="0" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Кількість</mat-label>
        <input matInput type="number" formControlName="quantity" min="1" />
      </mat-form-field>
    </div>

    <div class="checkbox-group">
      <mat-checkbox formControlName="isGroupGear">Групове спорядження</mat-checkbox>
      <mat-checkbox formControlName="isWearable">Одягнене на собі</mat-checkbox>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Скасувати</button>
  <button mat-button color="primary" [disabled]="gearForm.invalid" (click)="save()">
    Додати
  </button>
</mat-dialog-actions>
