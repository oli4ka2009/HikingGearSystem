<mat-toolbar color="primary">
  <span>Hiking Gear System</span>
  <span class="spacer"></span>
  <button mat-button (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-toolbar>

<div class="dashboard-content">
  <div class="header-row">
    <h2>Доступні походи</h2>
    <button mat-raised-button color="primary" (click)="createTrip()">
      <mat-icon>add</mat-icon>
      Створити похід
    </button>
  </div>

  <div class="trips-grid">
    @for (trip of trips(); track trip.id) {
      <mat-card>
        <mat-card-header>
          <div class="card-header-content">
            <mat-card-title>{{ trip.title }}</mat-card-title>
            <mat-card-subtitle>{{ trip.locationName }}</mat-card-subtitle>
          </div>
          <span class="spacer"></span>
          <button mat-icon-button color="warn" (click)="deleteTrip(trip.id)" aria-label="Видалити">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-header>
        <mat-card-content>
          <p><strong>Дати:</strong> {{ trip.startDate | date:'shortDate' }} - {{ trip.endDate | date:'shortDate' }}</p>
          <p><strong>Група:</strong> {{ trip.groupSize }} осіб</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button color="primary" [routerLink]="['/trips', trip.id]">Деталі</button>
        </mat-card-actions>
      </mat-card>
    } @empty {
      <p>Наразі немає доступних походів.</p>
    }
  </div>
</div>
